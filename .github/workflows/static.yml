# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='mono-custode' \
            --exclude='ceo-engine' \
            --exclude='security-audit' \
            --exclude='conto-casa' \
            --exclude='social-studio' \
            --exclude='docs' \
            --exclude='*.md' \
            --exclude='*.ps1' \
            --exclude='*.zip' \
            --exclude='*.docx' \
            ./ _site/
          # 29/7 - SECONDA RETE. Le esclusioni qui sopra valgono anche se un
          # domani uno di questi file rientra nel repo per sbaglio: il sito
          # pubblicato non li conterra' comunque.
          # ⚠️ '*.md' esclude anche README.md e pdf/README.md: e' voluto,
          #    nessuna pagina del sito li richiama.
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
